name: Ежедневные посты в Telegram
# Активация расписания: 20 июля 2026
on:
  schedule:
    # 7:00 МСК = 4:00 UTC
    - cron: "0 4 * * *"
    # 13:00 МСК = 10:00 UTC
    - cron: "0 10 * * *"
    # 19:00 МСК = 16:00 UTC
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Create Python script
        run: |
          cat > post_generator.py << 'EOF'
          import requests
          import os
          import sys
          import re
          from datetime import datetime

          # --- Определяем тип поста по времени (UTC) ---
          def get_post_type():
              now = datetime.now()
              hour = now.hour
              if 4 <= hour < 7:
                  return "morning"
              elif 10 <= hour < 13:
                  return "afternoon"
              elif 16 <= hour < 19:
                  return "evening"
              else:
                  return None

          # --- Очистка текста от <think> и звёздочек ---
          def clean_post_text(text):
              cleaned = re.sub(r'<think>.*?</think>', '', text, flags=re.DOTALL)
              cleaned = re.sub(r'\*\*', '', cleaned)
              cleaned = re.sub(r'\*', '', cleaned)
              cleaned = re.sub(r'\n\s*\n', '\n\n', cleaned).strip()
              return cleaned

          # --- Получаем токен GitHub из окружения ---
          github_token = os.environ.get("GITHUB_TOKEN")
          if not github_token:
              print("Ошибка: GITHUB_TOKEN не найден")
              sys.exit(1)

          today = datetime.now().strftime("%d %B %Y")
          post_type = get_post_type()

          if post_type is None:
              print("Неизвестное время запуска, пропускаем.")
              sys.exit(0)

          print(f"Генерация поста типа: {post_type}")

          # --- Выбор промпта в зависимости от времени ---
          if post_type == "morning":
              user_prompt = (
                  f"Сегодня {today}. Придумай пост для Telegram-канала с 'Картой дня'. "
                  "Выбери одну карту Таро и опиши её значение для сегодняшнего дня. "
                  "Дай совет, на что обратить внимание. Сделай текст тёплым, философским, "
                  "как разговор у камина. Текст — 150-200 слов. "
                  "Не используй списки, инструкции и Markdown."
              )
          elif post_type == "afternoon":
              user_prompt = (
                  f"Сегодня {today}. Напиши короткий пост (50-80 слов) с советом дня. "
                  "Возьми карту дня (ту же, что утром, или новую) и дай одну конкретную мысль, "
                  "которая поможет подписчику в середине дня. Сделай текст вдохновляющим и прямым, "
                  "как напоминание от друга. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "evening":
              user_prompt = (
                  f"Сегодня {today}. Напиши вечерний пост (150-200 слов) с итогом дня. "
                  "Сделай простой расклад на три карты: "
                  "1) Что я приобрёл сегодня (энергия, знание, ощущение). "
                  "2) Что я отпустил (страх, сомнение, усталость). "
                  "3) Что благодарно принять. Опиши каждую карту через образы и чувства. "
                  "Сделай текст уютным, как вечерний чай. Не используй списки, инструкции и Markdown."
              )

          # --- Запрос к GitHub Models ---
          url = "https://models.inference.ai.azure.com/chat/completions"
          headers = {
              "Authorization": f"Bearer {github_token}",
              "Content-Type": "application/json"
          }
          payload = {
              "model": "DeepSeek-R1",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "Ты — AiLex, таролог с 25-летним стажем. "
                          "Ты пишешь посты для Telegram-канала 'Школа Таро с AiLex'. "
                          "Твой стиль — образный, философский, как разговор у камина. "
                          "Не используй списки, инструкции и Markdown-разметку."
                      )
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "temperature": 0.7,
              "max_tokens": 3000
          }

          try:
              response = requests.post(url, headers=headers, json=payload, timeout=60)
              response.raise_for_status()
              result = response.json()
              raw_text = result["choices"][0]["message"]["content"]
              post_text = clean_post_text(raw_text)
              print("Пост сгенерирован.")
          except Exception as e:
              print(f"Ошибка при обращении к GitHub Models: {e}")
              sys.exit(1)

          # --- Отправка в Telegram ---
          telegram_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not telegram_token or not chat_id:
              print("Ошибка: не найдены токен или ID канала.")
              sys.exit(1)

          telegram_api_url = f"https://api.telegram.org/bot{telegram_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": post_text,
          }

          response = requests.post(telegram_api_url, json=payload)

          if response.status_code == 200:
              print(f"✅ Пост типа '{post_type}' успешно отправлен в Telegram!")
          else:
              print(f"❌ Ошибка при отправке: {response.status_code}")
              print(response.text)
              sys.exit(1)
          EOF

      - name: Run script
        run: python post_generator.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
