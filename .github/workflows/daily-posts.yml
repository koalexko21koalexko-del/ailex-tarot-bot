name: Ежедневные посты в Telegram

on:
  schedule:
    # 7:00 МСК = 4:00 UTC — карта дня (ежедневно)
    - cron: "0 4 * * *"
    # 11:00 МСК = 8:00 UTC — мысль дня / цитата (ежедневно)
    - cron: "0 8 * * *"
    # 13:00 МСК = 10:00 UTC — дневной совет (ежедневно)
    - cron: "0 10 * * *"
    # 19:00 МСК = 16:00 UTC — вечерний расклад (ежедневно)
    - cron: "0 16 * * *"
    # 8:00 МСК = 5:00 UTC — 1-го числа гороскоп на месяц
    - cron: "0 5 1 * *"
    # 8:00 МСК = 5:00 UTC — по понедельникам гороскоп на неделю
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Create Python script
        run: |
          cat > post_generator.py << 'EOF'
          import requests
          import os
          import sys
          import re
          from datetime import datetime

          # --- Определяем знак зодиака по дате ---
          def get_zodiac_sign(month, day):
              if (month == 1 and day >= 20) or (month == 2 and day <= 18):
                  return "Водолей"
              elif (month == 2 and day >= 19) or (month == 3 and day <= 20):
                  return "Рыбы"
              elif (month == 3 and day >= 21) or (month == 4 and day <= 19):
                  return "Овен"
              elif (month == 4 and day >= 20) or (month == 5 and day <= 20):
                  return "Телец"
              elif (month == 5 and day >= 21) or (month == 6 and day <= 21):
                  return "Близнецы"
              elif (month == 6 and day >= 22) or (month == 7 and day <= 22):
                  return "Рак"
              elif (month == 7 and day >= 23) or (month == 8 and day <= 22):
                  return "Лев"
              elif (month == 8 and day >= 23) or (month == 9 and day <= 22):
                  return "Дева"
              elif (month == 9 and day >= 23) or (month == 10 and day <= 23):
                  return "Весы"
              elif (month == 10 and day >= 24) or (month == 11 and day <= 22):
                  return "Скорпион"
              elif (month == 11 and day >= 23) or (month == 12 and day <= 21):
                  return "Стрелец"
              else:
                  return "Козерог"

          # --- Определяем тип поста ---
          def get_post_type():
              now = datetime.now()
              hour = now.hour
              day = now.day
              weekday = now.weekday()  # 0 = понедельник, 6 = воскресенье

              # Если сегодня 1-е число месяца — гороскоп на месяц
              if day == 1:
                  return "monthly_horoscope"
              # Если сегодня понедельник — гороскоп на неделю
              elif weekday == 0:
                  return "weekly_horoscope"
              # Тематические дни
              elif weekday == 1:  # Вторник
                  return "tuesday_thought"  # Мысль дня
              elif weekday == 2:  # Среда
                  return "wednesday_card"  # Карта-послание
              elif weekday == 3:  # Четверг
                  return "thursday_tarot"  # Разбор Аркана
              elif weekday == 4:  # Пятница
                  return "friday_love"  # Любовный расклад
              elif weekday == 5:  # Суббота
                  return "saturday_story"  # История из практики
              elif weekday == 6:  # Воскресенье
                  return "sunday_summary"  # Итог недели
              # Обычные посты по времени (если день не тематический)
              elif 0 <= hour < 7:
                  return "morning"
              elif 7 <= hour < 12:
                  return "quote"  # Цитата из книги
              elif 12 <= hour < 16:
                  return "afternoon"
              else:
                  return "evening"

          # --- Очистка текста ---
          def clean_post_text(text):
              cleaned = re.sub(r'<think>.*?</think>', '', text, flags=re.DOTALL)
              cleaned = re.sub(r'\*\*', '', cleaned)
              cleaned = re.sub(r'\*', '', cleaned)
              cleaned = re.sub(r'\n\s*\n', '\n\n', cleaned).strip()
              return cleaned

          # --- Токен OpenRouter ---
          openrouter_token = os.environ.get("OPENROUTER_API_KEY")
          if not openrouter_token:
              print("Ошибка: OPENROUTER_API_KEY не найден")
              sys.exit(1)

          now = datetime.now()
          today = now.strftime("%d %B %Y")
          post_type = get_post_type()

          print(f"Генерация поста типа: {post_type}")

          # --- Выбор промпта ---
          if post_type == "morning":
              user_prompt = (
                  f"Сегодня {today}. Придумай пост для Telegram-канала с 'Картой дня'. "
                  "Выбери одну карту Таро и опиши её значение для сегодняшнего дня. "
                  "Дай совет, на что обратить внимание. Сделай текст тёплым, философским, "
                  "как разговор у камина. Текст — 150-200 слов. "
                  "Не используй списки, инструкции и Markdown."
              )
          elif post_type == "quote":
              user_prompt = (
                  f"Сегодня {today}. Напиши короткий пост (50-80 слов) с вдохновляющей цитатой или мыслью из книги 'Тишина, которая говорит'. "
                  "Это должна быть глубокая, философская мысль, которая заставит задуматься. "
                  "Можешь добавить комментарий от себя. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "afternoon":
              user_prompt = (
                  f"Сегодня {today}. Напиши короткий пост (50-80 слов) с советом дня. "
                  "Возьми карту дня (ту же, что утром, или новую) и дай одну конкретную мысль, "
                  "которая поможет подписчику в середине дня. Сделай текст вдохновляющим и прямым, "
                  "как напоминание от друга. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "evening":
              user_prompt = (
                  f"Сегодня {today}. Напиши вечерний пост (150-200 слов) с итогом дня. "
                  "Сделай простой расклад на три карты: "
                  "1) Что я приобрёл сегодня. "
                  "2) Что я отпустил. "
                  "3) Что благодарно принять. "
                  "Опиши каждую карту через образы и чувства. "
                  "Сделай текст уютным, как вечерний чай. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "monthly_horoscope":
              zodiac_sign = get_zodiac_sign(now.month, now.day)
              month_name = now.strftime("%B").lower()
              user_prompt = (
                  f"Сегодня 1-е число месяца. Напиши астрологический прогноз для знака {zodiac_sign} на месяц {month_name}. "
                  f"Опиши, что ожидает {zodiac_sign} в личной жизни, финансах и здоровье. "
                  "Сделай текст тёплым, поддерживающим и вдохновляющим. "
                  f"Дай практический совет для знака {zodiac_sign} на месяц. "
                  "Текст — 250-300 слов. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "weekly_horoscope":
              zodiac_sign = get_zodiac_sign(now.month, now.day)
              user_prompt = (
                  f"Сегодня понедельник. Напиши астрологический прогноз для знака {zodiac_sign} на неделю. "
                  f"Что важно для {zodiac_sign} на этой неделе: в работе, в отношениях, в самочувствии. "
                  "Сделай текст коротким, но глубоким — 150-200 слов. "
                  "Дай один конкретный совет для этой недели. "
                  "Не используй списки, инструкции и Markdown."
              )
          elif post_type == "tuesday_thought":
              user_prompt = (
                  f"Сегодня вторник. Напиши пост 'Мысль дня' на тему самопознания и развития. "
                  "Это должна быть глубокая, философская мысль, связанная с Таро и жизненными уроками. "
                  "Сделай текст кратким, но сильным — 80-120 слов. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "wednesday_card":
              user_prompt = (
                  f"Сегодня среда. Напиши пост 'Карта-послание'. Выбери одну карту Таро и напиши, "
                  "какое послание она несёт всем подписчикам. Сделай текст глубоким и универсальным, "
                  "чтобы каждый мог найти в нём что-то своё. Текст — 120-150 слов. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "thursday_tarot":
              user_prompt = (
                  f"Сегодня четверг. Напиши пост с разбором одного Старшего Аркана. "
                  "Выбери один Аркан, опиши его символизм, значение в прямом и перевёрнутом положении. "
                  "Сделай текст интересным и познавательным — 150-200 слов. Не используй списки, инструкции и Markdown."
              )
          elif post_type == "friday_love":
              user_prompt = (
                  f"Сегодня пятница. Напиши пост с любовным раскладом на выходные. "
                  "Сделай простой расклад на три карты для отношений. "
                  "Дай мягкие, поддерживающие рекомендации. Текст — 150-200 слов. "
                  "Не используй списки, инструкции и Markdown."
              )
          elif post_type == "saturday_story":
              user_prompt = (
                  f"Сегодня суббота. Напиши пост 'История из практики'. "
                  "Расскажи короткую, поучительную историю о том, как Таро помогло человеку. "
                  "Не называй имён, но передай суть. Сделай текст живым и тёплым — 150-200 слов. "
                  "Не используй списки, инструкции и Markdown."
              )
          elif post_type == "sunday_summary":
              user_prompt = (
                  f"Сегодня воскресенье. Напиши пост с итогом недели. "
                  "Сделай расклад на три карты: что ушло, что осталось, что будет. "
                  "Дай вдохновляющее завершение недели. Текст — 150-200 слов. "
                  "Не используй списки, инструкции и Markdown."
              )
          else:
              user_prompt = (
                  f"Сегодня {today}. Придумай пост для Telegram-канала с 'Картой дня'. "
                  "Выбери одну карту Таро и опиши её значение для сегодняшнего дня. "
                  "Дай совет, на что обратить внимание. Текст — 150-200 слов. "
                  "Не используй списки, инструкции и Markdown."
              )

          # --- Запрос к OpenRouter ---
          print("Отправка запроса к OpenRouter...")

          url = "https://openrouter.ai/api/v1/chat/completions"

          headers = {
              "Authorization": f"Bearer {openrouter_token}",
              "Content-Type": "application/json"
          }

          payload = {
              "model": "deepseek/deepseek-chat",
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "Ты — AiLex, таролог с 25-летним стажем. "
                          "Ты пишешь посты для Telegram-канала 'Школа Таро с AiLex'. "
                          "Твой стиль — образный, философский, как разговор у камина. "
                          "Не используй списки, инструкции и Markdown."
                      )
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "temperature": 0.7,
              "max_tokens": 3000
          }

          try:
              response = requests.post(url, headers=headers, json=payload, timeout=60)
              response.raise_for_status()
              result = response.json()
              raw_text = result["choices"][0]["message"]["content"]
              post_text = clean_post_text(raw_text)
              print("Пост сгенерирован.")
          except Exception as e:
              print(f"Ошибка при обращении к OpenRouter: {e}")
              sys.exit(1)

          # --- Отправка в Telegram ---
          telegram_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not telegram_token or not chat_id:
              print("Ошибка: не найдены токен или ID канала.")
              sys.exit(1)

          telegram_api_url = f"https://api.telegram.org/bot{telegram_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": post_text,
          }

          response = requests.post(telegram_api_url, json=payload)

          if response.status_code == 200:
              print(f"✅ Пост типа '{post_type}' успешно отправлен в Telegram!")
          else:
              print(f"❌ Ошибка при отправке: {response.status_code}")
              print(response.text)
              sys.exit(1)
          EOF

      - name: Run script
        run: python post_generator.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
